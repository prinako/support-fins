name: Container

on:
  pull_request:
    paths:
      - 'web/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx.conf'
      - 'LICENSE'
      - '.github/workflows/container.yml'
  push:
    branches: [main, dev, latest]
    paths:
      - 'web/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx.conf'
      - 'LICENSE'
      - '.github/workflows/container.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: support-fins:test
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - name: Smoke test nginx
        run: |
          docker run --detach --name support-fins-ci --publish 127.0.0.1:8731:80 support-fins:test
          for _ in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8731/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs support-fins-ci
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm --force support-fins-ci 2>/dev/null || true

  publish:
    name: Publish multi-platform image
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest')) || (github.event_name == 'release' && github.event.release.prerelease == false) }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
