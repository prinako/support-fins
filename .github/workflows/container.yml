name: container

on:
  pull_request:
    paths:
      - 'web/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx.conf'
      - 'LICENSE'
      - '.github/workflows/container.yml'
      - 'docker-compose*.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=false
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published image
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          docker run -d --name support-fins-smoke -p 127.0.0.1:8731:80 "$IMAGE"
          trap 'docker logs support-fins-smoke; docker rm -f support-fins-smoke' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-connrefused --retry-delay 2 --max-time 5 http://127.0.0.1:8731/ -o /tmp/support-fins-index.html
          test -s /tmp/support-fins-index.html
