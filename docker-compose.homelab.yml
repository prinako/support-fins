# Standalone homelab deployment; do not combine with docker-compose.yml.
# Run from the repository root:
#   docker compose -f docker-compose.homelab.yml up -d --build
services:
  web:
    image: support-fins:homelab
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-fins
    ports:
      - "${SUPPORT_FINS_BIND_IP:-0.0.0.0}:${SUPPORT_FINS_PORT:-8731}:80"
    restart: unless-stopped
    environment:
      TZ: America/Belem
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${SUPPORT_FINS_NETWORK:-traefik-net}
